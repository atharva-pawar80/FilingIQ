name: Backend CI

# Runs on every push and PR so broken code never reaches main / deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        env:
          # Dummy key — unit tests here don't hit the real Groq API,
          # they just need Settings() to construct without erroring.
          # The eval-suite job below uses the REAL key from repo secrets.
          GROQ_API_KEY: dummy_key_for_ci_unit_tests
        run: pytest tests/ -v

  eval:
    # Runs the RAGAS eval suite against the real Groq API, but only after
    # unit tests pass — no point burning API calls on a broken build.
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run evaluation harness
        env:
          # Real key, stored in GitHub repo Settings -> Secrets -> Actions
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python eval/run_eval.py --ci-mode
